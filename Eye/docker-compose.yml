services:
  eye-of-voidleko-database:
    image: postgres:17
    container_name: eye-of-voidleko-postgres-database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eyeofvoidleko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isolated

  eye-of-voidleko-redis:
    image: redis:latest
    networks:
      - isolated

  eye-of-voidleko-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - eye-of-voidleko-database
      - eye-of-voidleko-redis
    environment:
      - EYE_OF_VOIDLEKO_DATABASE_USER=admin
      - EYE_OF_VOIDLEKO_DATABASE_PASSWORD=admin
      - EYE_OF_VOIDLEKO_DATABASE_HOST=eye-of-voidleko-database
      - EYE_OF_VOIDLEKO_DATABASE_PORT=5432
      - EYE_OF_VOIDLEKO_DATABASE_DNAME=eyeofvoidleko
      - EYE_OF_VOIDLEKO_REDIS_HOST=eye-of-voidleko-redis
      - EYE_OF_VOIDLEKO_REDIS_PORT=6379
      - EYE_OF_VOIDLEKO_REDIS_PASSWORD=
    networks:
      - isolated

volumes:
  postgres_data:

networks:
  isolated:
    driver: bridge
